services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lims
      POSTGRES_USER: lims
      POSTGRES_PASSWORD: lims
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lims"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    environment:
      DATABASE_URL: postgresql+psycopg://lims:lims@db:5432/lims
      JWT_SECRET: change-me-in-prod
    depends_on:
      db: { condition: service_healthy }
    # 迁移在运行时执行（构建期无 DATABASE_URL）；seed 幂等
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  web:
    build: { context: .., dockerfile: deploy/Dockerfile.frontend }
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
